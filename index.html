.hero.hero-events{display:block;min-height:0;margin-top:18px;padding:0;border:0;border-radius:0;background:none}

/* Keep cards, forms and navigation usable in a narrow viewport. */
@media (max-width: 760px) {
  .frame { width: calc(100% - 28px); }
  .top .frame { min-height: 64px; gap: 12px; }
  .nav a, .brand, .button, .pill { min-height: 44px; }
  .nav a, .button, .pill { padding: 8px 12px; }
  .hero {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
    margin-top: 16px;
    padding: 23px 18px;
    gap: 17px;
    border-radius: 16px;
  }
  .hero h1 { font-size: clamp(38px, 9vw, 62px); }
  .hero p:last-of-type { font-size: 15px; }
  .scan-items a { display: inline-flex; align-items: center; min-height: 44px; }
  .scan-items li { padding-top: 0; }
  .work { margin: 24px 0 32px; }
  .heading { align-items: stretch; gap: 12px; }
  .heading h2 { font-size: 28px; }
  .switch {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .filter-list { gap: 10px; }
  .filter-pills { gap: 6px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .stack { min-width: 0; }
  .event {
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 10px;
    padding: 13px;
  }
  .event h3, .deck h3 { overflow-wrap: anywhere; }
  .event .actions { gap: 6px; }
  .event .button { text-align: center; }
  .panel, .deck, .empty { padding: 15px; }
  .deck .heading { flex-direction: column; }
  .deck .actions { gap: 6px; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .stat { padding: 8px; overflow-wrap: anywhere; }
  .table-wrap { max-width: 100%; }
  .table-wrap table { min-width: 270px; }
  summary { min-height: 44px; padding: 10px 0; }
  dialog {
    width: min(530px, calc(100% - 20px));

    padding: 16px;

  .two { grid-template-columns: minmax(0, 1fr); }
  .footer .frame { flex-direction: column; gap: 4px; }

          typeof event.venue!=="string" || !event.venue || !formats.includes(event.format) ||
          !dateKey(event.discoveredOn) || !safeUrl(event.url) ||

      if (event.end && (!event.start || !Number.isFinite(Date.parse(event.end)) || Date.parse(event.end)<Date.parse(event.start))) continue;

function archetypeKey(format,name) {

function goldfishArchetypeUrl(format,name) {
  const live = window.MagicDashTools.feed.meta?.[format]?.share?.rows?.find(row=>normalize(row[0])===normalize(name));
  if (live?.[2] && /^[a-z0-9-]+$/i.test(live[2])) return "https://www.mtggoldfish.com/archetype/"+live[2];
  const links = goldfishArchetypes[format] || {};

  const key = archetypeKey(format,name);
  const candidates = Object.entries(links).filter(([label])=>archetypeKey(format,label)===key);
  return candidates.length===1 ? "https://www.mtggoldfish.com/archetype/"+candidates[0][1] : "";

function combinedMetagame(format,windowIndex) {
  const highlander = format==="7-Point Highlander";
  const highlanderSnapshot = highlander && windowIndex===5 ? meta[format]["TopDeck.gg"] : null;
  const live = window.MagicDashTools.feed.meta?.[format];
  const share = highlanderSnapshot || (windowIndex===2 ? live?.share || meta[format].MTGGoldfish : null);
  const rates = highlanderSnapshot
    ? {...highlanderSnapshot,rows:highlanderSnapshot.rows.filter(row=>row[4]!=null).map(row=>[row[0],row[4]])}
    : live?.rates?.[windowIndex] || windowRates[format]?.[windowIndex];
  const ambiguous = new Set();
  for (const source of [share,rates]) {
    const keys = new Set();
    for (const [name] of source?.rows || []) {
      const key = archetypeKey(format,name);
      if (keys.has(key)) ambiguous.add(key);
      keys.add(key);

    if (a.hash==="#play") a.textContent=competingCount ? "Play ("+competingCount+")" : "Play";
  });
  document.querySelector("#hero-label").textContent = label;
  document.querySelector("#hero-title").textContent = title;
  document.querySelector("#hero-copy").textContent = copy;
  scanPanel.hidden = page!=="#events";
  if (page==="#decks") showDecks();
  else if (page==="#buy") window.MagicDashTools.renderBuy(app);
  else if (page==="#play") showPlay();
  else showEvents();
}
const input = (label,name,value="",type="text",attrs="")=>'<label>'+label+'<input type="'+type+'" name="'+name+'" value="'+escapeText(value)+'" '+attrs+'></label>';
const select = (label,name,values,value)=>'<label>'+label+'<select name="'+name+'">'+options(values,value)+'</select></label>';
const textarea = (label,name,value="",attrs="")=>'<label>'+label+'<textarea name="'+name+'" '+attrs+'>'+escapeText(value)+'</textarea></label>';
function dialog(title,fields,onSubmit,onRemove,afterSave) {
  const opener = document.activeElement;
  const {action,id} = opener?.dataset || {};
  const finish = removed => {
    editor.close();
    render();
    const destination = afterSave?.() || actionControl(action,id) || pageHeading();
    destination.focus();
    const message = removed ? "Entry deleted." : afterSave ? "Match saved on this device." : "Saved on this device.";
    if (afterSave) app.querySelector("#compete-status").textContent=message;
    announce(message);
  };
  editor.innerHTML = '<form><h2 id="editor-title">'+title+'</h2>'+fields+
    '<p class="small error notice" role="alert"></p><div class="actions"><button type="submit" class="button primary">Save</button><button type="button" class="button" id="cancel">Cancel</button>'+
    (onRemove ? '<button type="button" class="button" id="remove">Delete</button>' : "")+'</div></form>';
  const form = editor.querySelector("form");
  const notice = editor.querySelector(".notice");
  editor.querySelector("#cancel").onclick = ()=>editor.close();
  form.onsubmit = event=>{
    event.preventDefault();
    const fields = Object.fromEntries([...new FormData(form)].map(([name,value])=>[name,value.trim()]));
    try {
      if (!persist(onSubmit(fields))) throw Error(saveMessage);
      finish(false);
    } catch (error) { notice.textContent = error.message; }
  };
  if (onRemove) editor.querySelector("#remove").onclick = event=>{
    if (event.currentTarget.textContent==="Delete") {
      event.currentTarget.textContent = "Confirm delete";
      return;
    }
    if (!persist(onRemove())) { notice.textContent=saveMessage; return; }
    finish(true);
  };
  editor.showModal();
}
const uuid = ()=>crypto.randomUUID();
const replace = (items,item)=>items.some(old=>old.id===item.id) ? items.map(old=>old.id===item.id?item:old) : [...items,item];
function editDeck(id) {
  const deck = state.decks.find(item=>item.id===id);
  const format = deck?.format || metaFormat;
  dialog(deck?"Edit deck":"Add a deck",
    '<fieldset class="archetype-picker"><legend>Choose an archetype</legend>'+
    input("Search archetypes","archetypeSearch","","search",'maxlength="80" placeholder="e.g. landfall or dragons"')+
    select("Format","format",formats,format)+
    '<label>Matching archetypes<select id="archetype-choices" size="6"></select></label><span class="small muted" id="archetype-count" aria-live="polite"></span>'+
    input("Selected archetype or your own","archetype",deck?.archetype,"text",'required maxlength="80"')+'</fieldset>'+
    input("Deck name","name",deck?.name,"text",'required maxlength="80" placeholder="e.g. Friday Night Boros"')+
    textarea("Decklist (optional)","list",deck?.list,'maxlength="25000" placeholder="Paste your main deck and sideboard"')+
    '<details><summary>Find cards with Scryfall</summary><div class="card-search">'+
    input("Card name","cardSearch","","search",'maxlength="100" placeholder="e.g. Ocelot Pride"')+
    '<button class="button" type="button" id="card-search-button">Find cards</button><div id="card-status" class="small muted" aria-live="polite"></div><div id="card-results" class="card-results"></div></div></details>',
    fields=>{
      const {name,archetype,format:chosenFormat,list} = fields;
      if (!name || !archetype) throw Error("Enter a deck name and an archetype.");
      if (deck && chosenFormat!==deck.format && deckMatches(deck).length) throw Error("This deck has match history. Add a new deck to track it in another format.");
      return {...state,decks:replace(state.decks,{id:deck?.id||uuid(),matches:deck?.matches||[],name,archetype,format:chosenFormat,list})};
    },deck?()=>({...state,decks:state.decks.filter(item=>item.id!==id)}):null);
  const form = editor.querySelector("form");
  const search = form.elements.archetypeSearch;
  const chosen = form.elements.archetype;
  const choices = editor.querySelector("#archetype-choices");
  const updateChoices = () => {
    const terms = search.value.trim().split(/\s+/).map(normalize).filter(Boolean);
    const results = archetypeNames(form.elements.format.value).filter(name=>terms.every(term=>normalize(name).includes(term)));
    choices.innerHTML = options(results,chosen.value);
    choices.selectedIndex = results.indexOf(chosen.value);
    editor.querySelector("#archetype-count").textContent = results.length+" matching archetypes";
  };
  search.addEventListener("input",updateChoices);
  form.elements.format.addEventListener("change",()=>{chosen.value="";updateChoices();});
  choices.addEventListener("change",()=>{chosen.value=choices.value;});
  updateChoices();
  connectCardSearch(form);
}
function connectCardSearch(form) {
  const field = form.elements.cardSearch;
  const status = form.querySelector("#card-status");
  const results = form.querySelector("#card-results");
  const trigger = form.querySelector("#card-search-button");
  async function findCards() {
    const query = field.value.trim();
    if (query.length<2) { status.textContent="Enter at least two characters."; return; }
    trigger.disabled = true;
    status.textContent = "Searching Scryfall…";
    results.replaceChildren();
    const params = new URLSearchParams({q:query});
    try {
      const response = await fetch("https://api.scryfall.com/cards/autocomplete?"+params,{headers:{Accept:"application/json"},signal:AbortSignal.timeout(8000)});
      if (!response.ok) throw Error("Card lookup unavailable");
      const cards = (await response.json()).data;
      if (!Array.isArray(cards)) throw Error("Invalid card response");
      status.textContent = cards.length ? "Choose a card to add one copy to your decklist." : "No matching card names.";
      for (const card of cards) {
        if (typeof card!=="string") continue;
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "button";
        choice.textContent = card;
        choice.addEventListener("click",()=>{
          const list = form.elements.list;
          const base = list.value.trimEnd();
          const sideboard = base.search(/^\s*sideboard\s*:?\s*$/im);
          const main = sideboard<0 ? base : base.slice(0,sideboard).trimEnd();
          const next = (main?main+"\n":"")+"1 "+card+(sideboard<0?"":"\n\n"+base.slice(sideboard).trimStart());
          if (next.length>list.maxLength) {status.textContent="The decklist has reached its length limit.";return;}
          list.value = next;
          status.textContent = "Added "+card+".";
        });
        results.append(choice);
      }
    } catch {
      status.textContent = "Card lookup is unavailable. Search on Scryfall and paste the card name.";
    } finally {
      results.insertAdjacentHTML("beforeend",link("https://scryfall.com/search?"+params,"Open Scryfall search ↗"));
      trigger.disabled = false;
    }
  }
  trigger.addEventListener("click",findCards);
  for (const input of [field,form.elements.archetypeSearch]) input.addEventListener("keydown",event=>{
    if (event.key!=="Enter") return;
    event.preventDefault();
    if (input===field && !trigger.disabled) findCards();
  });
}
function editMatch(id) {
  const [deckId,matchId] = id.split("/");
  const deck = state.decks.find(item=>item.id===deckId);
  const match = deck.matches.find(item=>item.id===matchId);
  const withMatches = matches=>({...state,decks:replace(state.decks,{...deck,matches})});
  dialog(match?"Edit match":"Log a match",
    '<div class="two">'+input("Date","date",match?.date||today(),"date","required")+
    select("Result","result",["Win","Loss","Draw"],{W:"Win",L:"Loss",D:"Draw"}[match?.result])+'</div>'+
    input("Opponent archetype","opponent",match?.opponent,"text",'required maxlength="80" list="opponents" placeholder="e.g. Domain Zoo"')+
    '<datalist id="opponents">'+options(archetypeNames(deck.format))+'</datalist>'+
    input("Event (optional)","event",match?.event,"text",'maxlength="100"'),
    fields=>{
      if (!fields.opponent) throw Error("Enter the opponent archetype.");
      return withMatches(replace(deck.matches,{...fields,id:match?.id||uuid(),result:fields.result[0]}));
    },match?()=>withMatches(deck.matches.filter(item=>item.id!==matchId)):null);
}
function toggleCompeting(id) {
  const saved = state.playEvents.find(item=>item.id===id);
  const listing = eventListings().find(item=>item.id===id);
  if (!saved && !listing) return;
  const competing = !saved?.competing;
  const entry = {...(saved || listing),competing,matches:saved?.matches || []};
  const playEvents = competing || entry.matches.length ? replace(state.playEvents,entry) : state.playEvents.filter(item=>item.id!==id);
  if (!persist({...state,playEvents})) {
    app.querySelector("#compete-status").textContent=saveMessage;
    return;
  }
  render();
  const message = competing ? "Event added to Play on this device." :
    entry.matches.length ? "Competing cleared. Your matches are saved in Play." : "Event removed from Play.";
  app.querySelector("#compete-status").textContent=message;
  if (playRoute()) announce(message);
  const control = actionControl("compete",id);
  const playLink = competing && control?.parentElement.querySelector('a[href^="#play/"]');
  (playLink || control || pageHeading()).focus();
}
function editPlayMatch(id) {
  const [encodedEventId,matchId] = id.split("/");
  const event = state.playEvents.find(item=>item.id===decodeURIComponent(encodedEventId));
  if (!event) return;
  const match = event.matches.find(item=>item.id===matchId);
  const decks = state.decks.filter(deck=>deck.format===event.format);
  const selectedDeck = match ? match.deckId : event.matches.at(-1)?.deckId || (decks.length===1?decks[0].id:"");
  const deckOptions = decks.map(deck=>'<option value="'+escapeText(deck.id)+'"'+(deck.id===selectedDeck?" selected":"")+'>'+escapeText(deck.name)+'</option>').join("");
  const withMatches = matches => ({...state,playEvents:replace(state.playEvents,{...event,matches})});
  dialog(match?"Edit event match":"Log event match",
    '<p class="small muted play-match-form-date">'+escapeText(event.title+" · "+dayText(localDate(eventDate(event))))+'</p>'+
    '<div class="two"><label>Your deck<select name="deckId"><option value="">Assign later</option>'+deckOptions+'</select></label>'+
    '<label>Result<select name="result" required><option value="">Choose result</option>'+options(Object.values(resultLabels),resultLabels[match?.result])+'</select></label></div>'+
    input("Opponent archetype","opponent",match?.opponent,"text",'required maxlength="80" list="play-opponents" placeholder="e.g. Domain Zoo"')+
    '<datalist id="play-opponents">'+options(archetypeNames(event.format))+'</datalist>'+
    input("Opponent name (optional)","opponentName",match?.opponentName,"text",'maxlength="100"')+
    textarea("Matchup notes (optional)","notes",match?.notes,'maxlength="2000"'),
    fields=>{
      if (!fields.opponent || !Object.values(resultLabels).includes(fields.result)) throw Error("Choose a result and enter the opponent archetype.");
      const deck = decks.find(item=>item.id===fields.deckId);
      return withMatches(replace(event.matches,{...fields,id:match?.id||uuid(),result:fields.result[0],
        deckId:deck?.id || "",deckName:deck?.name || ""}));
    },match?()=>withMatches(event.matches.filter(item=>item.id!==matchId)):null,
    ()=>actionControl("play-match",encodedEventId));
}
function editEvent(id) {
  const event = state.customEvents.find(item=>item.id===id);
  const date = event ? eventDate(event) : today();
  dialog(event?"Edit event":"Add an event",
    input("Event name","title",event?.title,"text",'required maxlength="100"')+
    '<div class="two">'+select("Where","scope",["Brisbane","Major event"],(event?.scope||scope)==="local"?"Brisbane":"Major event")+
    select("Format","format",formats,event?.format||filter)+'</div>'+
    select("Brisbane event category","category",eventCategories,event ? eventCategory(event) : category)+
    input("Venue or city","venue",event?.venue,"text",'required maxlength="100"')+
    '<div class="two">'+input("Date","date",date,"date","required")+input("Start time (AEST, optional)","time",event?.start?.slice(11,16),"time")+'</div>'+
    input("Event or registration URL","url",event?.url,"url",'required placeholder="https://"')+
    input("Stream URL (optional)","stream",event?.stream,"url",'placeholder="https://"'),
    fields=>{
      if (!fields.title || !fields.venue || !safeUrl(fields.url) || (fields.stream && !safeUrl(fields.stream))) throw Error("Enter a title, venue and valid HTTPS links.");
      const timed = fields.time ? {start:fields.date+"T"+fields.time+":00+10:00"} : {date:fields.date};
      const eventScope = fields.scope==="Brisbane" ? "local" : "major";
      const entry = {...timed,id:event?.id||uuid(),custom:true,scope:eventScope,discoveredOn:event ? event.discoveredOn : today(),
        category:eventScope==="local" ? fields.category : undefined,kind:"Personal listing",format:fields.format,title:fields.title,venue:fields.venue,url:fields.url,stream:fields.stream};
      const tracked = state.playEvents.find(item=>item.id===entry.id);
      if (tracked?.matches.length && tracked.format!==entry.format) throw Error("This event has match history. Keep its original format.");
      const playEvents = tracked ? replace(state.playEvents,{...entry,competing:tracked.competing,matches:tracked.matches}) : state.playEvents;
      return {...state,customEvents:replace(state.customEvents,entry),playEvents};
    },event?()=>({...state,customEvents:state.customEvents.filter(item=>item.id!==id)}):null);
}
function editSnapshot() {
  dialog("Add a metagame snapshot",
    select("Format","format",formats,metaFormat)+
    '<div class="two">'+input("Window ending","asOf",today(),"date","required")+input("Published lists","sample","","number",'required min="1" max="10000000" step="1"')+'</div>'+
    input("Date window label","window","","text",'required maxlength="70" placeholder="e.g. 8 Oct – 6 Nov 2026"')+
    input("Source name","source","","text",'required maxlength="70"')+
    input("Source link","url","","url",'required placeholder="https://"')+
    textarea("Archetype and share, one per line","rows","",'required maxlength="12000" placeholder="Boros Energy, 6.2\nRuby Storm, 3.3"'),
    fields=>{
      if (!fields.window || !fields.source || !safeUrl(fields.url)) throw Error("Enter the date window, source name and an HTTPS source link.");
      const seen = new Set();
      const rows = fields.rows.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
        const row = line.match(/^(.+),\s*(\d+(?:\.\d+)?)\s*%?$/);
        const name = row?.[1].trim();
        const id = name && normalize(name);
        if (!id || Number(row[2])>100 || seen.has(id)) throw Error("Use one unique archetype and a percentage from 0 to 100 per line.");
        seen.add(id);
        return [name,Number(row[2])];
      }).sort((a,b)=>b[1]-a[1]);
      if (!rows.length) throw Error("Enter at least one archetype.");
      const old = state.snapshots[fields.format]||[];
      const snapshot = {...fields,sample:Number(fields.sample),rows};
      return {...state,snapshots:{...state.snapshots,[fields.format]:[snapshot,...old.filter(item=>item.asOf!==fields.asOf)]}};
    });
}

app.addEventListener("click",event=>{
  const control = event.target.closest("button[data-action]");
  if (!control) return;
  const {action,id} = control.dataset;
  switch (action) {
    case "deck": editDeck(id); break;
    case "match": editMatch(id); break;
    case "play-match": editPlayMatch(id); break;
    case "compete": toggleCompeting(id); break;
    case "event": editEvent(id); break;
    case "snapshot": editSnapshot(); break;
    case "expand-meta":
      metaExpanded = !metaExpanded;
      showDecks();
      app.querySelector('[data-action="expand-meta"]').focus();
      break;
  }
});
app.addEventListener("input",event=>{
  if (event.target.id!=="meta-window") return;
  const label = metaWindows[Number(event.target.value)];
  event.target.setAttribute("aria-valuetext",label);
  document.getElementById("meta-window-value").textContent = label;
});
app.addEventListener("change",event=>{
  const {id,value} = event.target;
  if (["event-region","event-category","event-format"].includes(id)) {
    if (id==="event-region") { scope=value==="Brisbane"?"local":"major"; filter="All formats"; }
    if (id==="event-category") category=value;
    if (id==="event-format") filter=value;
    showEvents();
    document.getElementById(id).focus();
    return;
  }
  if (id!=="meta-format" && id!=="meta-window") return;
  if (id==="meta-format") metaFormat = value;
  else metaWindow = Number(value);
  metaExpanded = false;
  showDecks();
  document.getElementById(id).focus();
});
window.addEventListener("hashchange",()=>{
  if (editor.open) editor.close();

});
render();
window.MagicDashTools.loadFeed().then(updated=>{
